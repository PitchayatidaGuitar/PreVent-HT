const FORMS = {
  async loginPatient(f,fd){
    await storeReady;
    if(Store.mode==="api"){
      const creds={method:S.auth.method, first:fd.get("first"), last:fd.get("last"), phone:fd.get("phone"), cid:digits(fd.get("cid"))};
      S.auth.creds=creds; const r=await Api.call({op:"loginPatient", ...creds});
      if(!r.ok){ S.auth.msg=["err", r.error==="not_found"?"ไม่พบข้อมูลที่ตรงกัน ตรวจสอบการสะกด หรือกด “ลงทะเบียน” ถ้ายังไม่เคยลงทะเบียน":"เชื่อมต่อระบบไม่สำเร็จ ลองใหม่อีกครั้ง"]; S.auth.matches=null; render(); return; }
      if(r.matches){ S.auth.matches=r.matches; S.auth.msg=""; render(); return; }
      Api.setSid(r.sid); await startSession({role:"patient", id:r.id}); return;
    }
    const pats=await Store.list("patients"); let m=[];
    if(S.auth.method==="name"){ const a=norm(fd.get("first")), b=norm(fd.get("last")); m=pats.filter(p=>norm(p.first)===a && norm(p.last)===b); }
    else if(S.auth.method==="phone"){ const d=digits(fd.get("phone")); m=d?pats.filter(p=>digits(p.phone)===d):[]; }
    else { const d=digits(fd.get("cid")); m=d?pats.filter(p=>p.cid===d):[]; }
    if(!m.length){ S.auth.msg=["err","ไม่พบข้อมูลที่ตรงกัน ตรวจสอบการสะกด หรือกด “ลงทะเบียน” ถ้ายังไม่เคยลงทะเบียน"]; S.auth.matches=null; render(); return; }
    if(m.length>1){ S.auth.matches=m; S.auth.msg=""; render(); return; }
    await startSession({role:"patient", id:m[0].id});
  },
  async loginStaff(f,fd){
    await storeReady;
    if(Store.mode==="api"){
      const creds={method:S.auth.smethod||"name", first:fd.get("first"), last:fd.get("last"), phone:fd.get("phone"), cid:digits(fd.get("cid")), pin:String(fd.get("pin")||"").trim(), role:S.auth.role};
      S.auth.creds=creds; const r=await Api.call({op:"loginStaff", ...creds});
      if(!r.ok){ S.auth.matches=null; S.auth.msg=["err", r.error==="bad_pin"?"รหัส PIN ไม่ถูกต้อง": r.error==="wrong_role"?`บัญชีนี้เป็นบัญชี ${roleTH(r.role)} กรุณาเลือกแท็บ “${roleTH(r.role)}”`: r.error==="not_found"?"ไม่พบบัญชีที่ตรงกัน ตรวจสอบข้อมูลอีกครั้ง":"เชื่อมต่อระบบไม่สำเร็จ ลองใหม่อีกครั้ง"]; render(); return; }
      if(r.matches){ S.auth.matches=r.matches; S.auth.msg=""; render(); return; }
      Api.setSid(r.sid); await startSession({role:r.role, id:r.id, proxyStart:S.auth.proxyHint}); return;
    }
    if(String(fd.get("pin")||"").trim()!==STAFF_PIN){ S.auth.msg=["err","รหัส PIN ไม่ถูกต้อง"]; S.auth.matches=null; render(); return; }
    const sm=S.auth.smethod||"name";
    const all=await Store.list("staff");
    let cands=[];
    if(sm==="name"){ const a=norm(fd.get("first")), b=norm(fd.get("last")); cands=all.filter(x=>norm(x.first)===a && norm(x.last)===b); }
    else if(sm==="cid"){ const c=digits(fd.get("cid")); cands=c?all.filter(x=>x.cid===c):[]; }
    else { const p=digits(fd.get("phone")); cands=p?all.filter(x=>digits(x.phone)===p):[]; }
    const lab={name:"ชื่อ-สกุล",cid:"เลขบัตรประชาชน",phone:"เบอร์โทร"}[sm];
    const mine=cands.filter(x=>x.role===S.auth.role);
    if(cands.length && !mine.length){ S.auth.msg=["err",`บัญชีนี้เป็นบัญชี ${roleTH(cands[0].role)} กรุณาเลือกแท็บ “${roleTH(cands[0].role)}”`]; S.auth.matches=null; render(); return; }

  async bp(f,fd){
    const s1=+fd.get("s1"), d1=+fd.get("d1"), s2=+fd.get("s2"), d2=+fd.get("d2");
    if(!(s1>=60&&s1<=260&&d1>=30&&d1<=160)) return fail(f,"กรุณากรอกค่าความดันครั้งที่ 1 ให้ถูกต้อง (ตัวบน 60–260 ตัวล่าง 30–160)");
    if(d1>=s1) return fail(f,"ตัวล่างต้องน้อยกว่าตัวบน ตรวจสอบตัวเลขอีกครั้ง");
    const c1=bpClass(s1,d1);
    const has2 = s2>=60 && d2>=30;
    if(c1.i>=3 && !has2 && !f.dataset.skip2){ f.dataset.skip2="1"; return fail(f,"ค่าครั้งแรกสูง กรุณานั่งพัก 5 นาทีแล้ววัดครั้งที่ 2 ถ้าวัดซ้ำไม่ได้ กด “บันทึกและแปลผล” อีกครั้งเพื่อบันทึกค่าครั้งเดียว"); }
    const r1={sys:s1,dia:d1,pulse:+fd.get("p1")||null}, r2=has2?{sys:s2,dia:d2,pulse:+fd.get("p2")||null}:null;
    const sys=r2?Math.round((s1+s2)/2):s1, dia=r2?Math.round((d1+d2)/2):d1;
    await saveAssess("bp",{sys,dia,pulse:r2?.pulse||r1.pulse,r1,r2});
    showResult();
  },
  async body(f,fd){

  async saltm(f,fd){
    const items=[0,1,2].map(i=>({menu:String(fd.get("menu"+i)||"").trim(), pct:String(fd.get("pct"+i)||"").trim()})).filter(x=>x.pct!=="").map(x=>({menu:x.menu||"อาหาร", pct:Math.round(+x.pct*100)/100}));

    const score=ans.reduce((s,a)=>s+ +a,0), top=SALT_Q.map((q,i)=>[q,+ans[i]]).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);

  async visit(f,fd){

    const s1=num("s1"), d1=num("d1"), s2=num("s2"), d2=num("d2"), w=num("w"), h=num("h"), waist=num("waist"), fbs=num("fbs"), saltPct=num("saltPct"), pulse=num("pulse");
    if((s1&&!d1)||(!s1&&d1)) return fail(f,"กรุณากรอกความดันทั้งตัวบนและตัวล่าง");
    if(s1 && (s1<60||s1>260||d1<30||d1>160||d1>=s1)) return fail(f,"ค่าความดันไม่ถูกต้อง ตรวจสอบตัวเลขอีกครั้ง");

    const date=fd.get("date"), time=fd.get("time"), at=new Date(`${date}T${time}:00`).getTime();
    const has2 = s2 && d2;
    const bp = s1 ? {sys:has2?Math.round((s1+s2)/2):s1, dia:has2?Math.round((d1+d2)/2):d1, r1:{sys:s1,dia:d1}, r2:has2?{sys:s2,dia:d2}:null} : null;
    const bmi = w&&h ? w/((h/100)**2) : null;
    const sex = p.sex==="หญิง"?"หญิง":"ชาย";
    const mk=!!fd.get("mkNext"), nextDate=mk?fd.get("nextDate"):"", nextTime=fd.get("nextTime")||"09:00";

    if(w&&h) latest.body={w,h,bmi,...stamp};

    const vid=Store.uid();
    await Store.set(`patients/${pid}/visits/${vid}`, v);
    Store.set(`visits_all/${vid}`, {...v, pid, pname:fullName(p)}).catch(()=>{});
    await Store.update(`patients/${pid}`, upd);

    logEvent("visit"); S.dirty=false; go("s-visits",{id:pid});

function attachPicker(){
  return `<div class="field"><span class="lab">แนบรูปภาพ / วิดีโอ</span>
    <div class="row"><label class="btn soft sm attach-btn">${I.camera}เพิ่มรูปภาพ/วิดีโอ<input type="file" id="msgFiles" accept="image/*,video/*" multiple hidden></label><span class="small muted">ได้สูงสุด ${MAX_ATTACH} ไฟล์ · วิดีโอไม่เกิน 20 MB</span></div>
    <div id="attachBox" class="attach-grid">${attachBoxHTML()}</div></div>`;
}
function attachBoxHTML(){
  return (S.attach||[]).map((x,i)=>`<div class="attach-item">${x.kind==="video"?`<video src="${x.url}" muted playsinline preload="metadata"></video><span class="attach-tag">วิดีโอ</span>`:`<img src="${x.url}" alt="รูปที่แนบ ${i+1}">`}<button type="button" class="attach-x" data-act="rmAttach" data-i="${i}" aria-label="ลบไฟล์แนบ">×</button></div>`).join("");
}
function addAttach(files){
  const box=$("#attachBox"); let warn="";
  for(const f of files){
    if(S.attach.length>=MAX_ATTACH){ warn=`แนบได้สูงสุด ${MAX_ATTACH} ไฟล์`; break; }
    const kind=f.type.startsWith("video/")?"video":f.type.startsWith("image/")?"image":null;
    if(!kind){ warn="แนบได้เฉพาะรูปภาพหรือวิดีโอ"; continue; }
    if(kind==="video" && f.size>MAX_VIDEO){ warn=`วิดีโอ “${f.name}” ใหญ่เกิน 20 MB ลองตัดให้สั้นลง`; continue; }
    S.attach.push({file:f, kind, name:f.name, url:URL.createObjectURL(f)});
  }
  S.dirty=true;
  if(box) box.innerHTML=attachBoxHTML()+(warn?`<p class="msg warn small" style="grid-column:1/-1">${esc(warn)}</p>`:"");
}
async function driveUpload(blob){
  if(blob.size>15*1024*1024) throw {code:"too_large"};
  const b64 = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); });
  const r = await Api.call({op:"upload", name:blob.name||"file", type:blob.type||"image/jpeg", b64});
  if(!r.ok) throw {code:r.error};
  return {id:r.id, url:r.url, open:r.open, drive:true, sizeBytes:r.size, contentType:r.type, kindHint:r.kind};
}
async function uploadAttachments(f){
  if(!S.attach.length) return [];
  const m=f.querySelector("#formMsg");
  const assets = Store.mode==="api" ? {upload: driveUpload} : (window.claude?.use ? await window.claude.use("assets").catch(()=>null) : null);
  if(!assets){ fail(f,"ตอนนี้แนบรูปภาพ/วิดีโอไม่ได้ในหน้านี้ ลบไฟล์แนบแล้วส่งข้อความได้ หรือส่งรูปให้ อสม. โดยตรง"); return null; }
  const out=[];
  for(let i=0;i<S.attach.length;i++){
    const x=S.attach[i];
    if(m) m.innerHTML=`<div class="msg info" aria-live="polite">กำลังอัปโหลดไฟล์ ${i+1}/${S.attach.length}…</div>`;
    try{
      let blob=x.file;
      if(x.kind==="image" && !/gif|svg/.test(blob.type)) blob = await downscale(blob,1600).catch(()=>x.file) || x.file;
      const r = await assets.upload(blob, blob.type?undefined:{type:x.kind==="video"?"video/mp4":"image/jpeg"});
      out.push({id:r.id, url:r.url, kind:x.kind, type:r.contentType, name:x.name, size:r.sizeBytes, ...(r.drive?{drive:true, open:r.open}:{})});
    }catch(e){
      const why = e?.code==="too_large"?"ไฟล์ใหญ่เกินไป": e?.code==="unsupported_type"?"รูปแบบไฟล์นี้ใช้ไม่ได้ ลองบันทึกเป็น JPG หรือ MP4": e?.code==="not_granted"?"ยังไม่ได้อนุญาตให้อัปโหลดไฟล์": e?.code==="rate_limited"?"อัปโหลดถี่เกินไป รอสักครู่แล้วลองใหม่":"อัปโหลดไม่สำเร็จ";
      fail(f,`ไฟล์ “${esc(x.name)}”: ${why}`); return null;
    }
  }
  return out;
}
function attachView(list){
  if(!list?.length) return "";
  return `<div class="attach-grid view">${list.map((a,i)=>{ const url=a.url||("/_blob/"+a.id);
    if(a.drive && a.kind==="video") return `<a class="attach-item vid-open" href="${esc(a.open||url)}" target="_blank" rel="noopener"><span>▶</span><small>เปิดวิดีโอ</small></a>`;
    if(a.drive) return `<a class="attach-item" href="${esc(a.open||url)}" target="_blank" rel="noopener"><img src="${esc(url)}" alt="รูปที่แนบ ${i+1}" loading="lazy" referrerpolicy="no-referrer"></a>`;
    return a.kind==="video"
    ? `<div class="attach-item"><video src="${esc(url)}" controls playsinline preload="metadata"></video></div>`
    : `<a class="attach-item" href="${esc(url)}" target="_blank" rel="noopener"><img src="${esc(url)}" alt="รูปที่แนบ ${i+1}" loading="lazy"></a>`; }).join("")}</div>`;
}
async function sendMsg(kind,topic,text,f){
  const p=P(); if(!p||p.demo) return;
  if(kind==="question" && !text && !S.attach.length) return fail(f,"กรุณาพิมพ์คำถาม หรือแนบรูปภาพ/วิดีโอ");
  const attachments = await uploadAttachments(f);
  if(attachments===null) return;
  await Store.set(`messages/${Store.uid()}`, {pid:p.id, pname:fullName(p), vhvId:p.vhvId||"", kind, topic, text, attachments, status:"open", replies:[], at:Date.now(), lastAt:Date.now(), by: S.proxy?`${fullName(p)} (${actorLabel()})`:fullName(p)});
  logEvent(kind);
  clearAttach(); S.dirty=false; S.flash=["ok", kind==="help"?"ส่งคำขอแล้ว อสม. และเจ้าหน้าที่จะติดต่อกลับ":"ส่งคำถามแล้ว เจ้าหน้าที่จะตอบกลับในแอปนี้"]; S.params={tab:"contact"}; render();
}

/* =================== start =================== */
renderSplash();
</script>
