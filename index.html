<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobile-first app shell — sticky green header, single column of cards, fixed bottom tab bar; staff views widen to a two-column grid on desktop */
:root{
  --bg:#f3f7f4; --surface:#ffffff; --surface-2:#edf3ef; --ink:#1c2c23; --ink-2:#5b6e62; --line:#e0e9e3; --input-bg:#f9fbfa;
  --brand:#14834b; --brand-deep:#0c5f36; --brand-soft:#e3f3e9; --on-brand:#ffffff;
  --head-bg:#107a45; --head-grad:linear-gradient(140deg,#0e6e3d 0%,#16934f 100%); --head-ink:#f5fcf7; --head-ink-2:#cdebd8;
  --pulse:#d9473c;
  --ok:#23864c; --ok-soft:#e2f4e8; --warn:#a96d05; --warn-soft:#fcf2dc; --bad:#c43a30; --bad-soft:#fce6e3; --none:#6d7c72; --none-soft:#eef2ef;
  --shadow:0 1px 2px rgba(16,70,40,.04),0 8px 24px rgba(16,70,40,.07);
  --shadow-lg:0 2px 6px rgba(16,70,40,.06),0 18px 40px rgba(16,70,40,.12);
  --f-display:"Mitr","Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --f-body:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --r:18px; --seg-hover:#f0f8f3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1611; --surface:#152119; --surface-2:#1b2a21; --ink:#e4eee7; --ink-2:#a5b7ab; --line:#25362c; --input-bg:#111c15;
  --brand:#45bb76; --brand-deep:#2a9a5a; --brand-soft:#183627; --on-brand:#06210f;
  --head-bg:#12301f; --head-grad:linear-gradient(140deg,#102a1b 0%,#17402a 100%); --head-ink:#eaf6ee; --head-ink-2:#9ccaae;
  --pulse:#f0705f;
  --ok:#58c47e; --ok-soft:#163222; --warn:#e5b04a; --warn-soft:#33280f; --bad:#f07a6e; --bad-soft:#3a1a17; --none:#95a59a; --none-soft:#1f2b24;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.35); --seg-hover:#203629; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1611; --surface:#152119; --surface-2:#1b2a21; --ink:#e4eee7; --ink-2:#a5b7ab; --line:#25362c; --input-bg:#111c15;
  --brand:#45bb76; --brand-deep:#2a9a5a; --brand-soft:#183627; --on-brand:#06210f;
  --head-bg:#12301f; --head-grad:linear-gradient(140deg,#102a1b 0%,#17402a 100%); --head-ink:#eaf6ee; --head-ink-2:#9ccaae;
  --pulse:#f0705f;
  --ok:#58c47e; --ok-soft:#163222; --warn:#e5b04a; --warn-soft:#33280f; --bad:#f07a6e; --bad-soft:#3a1a17; --none:#95a59a; --none-soft:#1f2b24;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.35); --seg-hover:#203629; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head-bg)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:1.3rem} h3{font-size:1.08rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.wide .wrap{max-width:1120px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid2 > *{min-width:0}

/* ---------- splash ---------- */
.splash{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:22px;padding-block:32px;background:radial-gradient(120% 80% at 50% 0%,var(--brand-soft),var(--bg) 70%)}
.lockup{display:flex;align-items:center;gap:14px}
.lockup .x{font-family:var(--f-display);font-size:1.6rem;color:var(--ink-2)}
.lockup img{width:92px;height:92px}
.brandname{font-family:var(--f-display);font-size:2.4rem;font-weight:600;letter-spacing:.01em;color:var(--brand-deep)}
.brandname b{color:var(--pulse);font-weight:600}
.brandname .ht{display:inline-block;margin-left:.25em;padding:0 .3em;border-radius:8px;background:var(--brand);color:var(--on-brand);font-size:.62em;vertical-align:.25em}
:root[data-theme="dark"] .brandname{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brandname{color:var(--ink)}}
.org{color:var(--ink-2);max-width:100%}
.org strong{display:block;color:var(--ink);font-weight:600;font-size:min(1.05rem,4vw);white-space:nowrap}
.oneline{white-space:nowrap;font-size:min(.88rem,3.4vw)}
.ecg{width:min(340px,100%);height:56px}
.ecg path{fill:none;stroke:var(--pulse);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.4s linear infinite}
@keyframes draw{to{stroke-dashoffset:-420}}
.prog{width:min(340px,100%);height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog > i{display:block;height:100%;width:0;background:var(--brand);transition:width 1s linear}
.tip{min-height:3.2em;max-width:34ch;font-size:1rem}
@media (prefers-reduced-motion: reduce){.ecg path{animation:none;stroke-dashoffset:0}.prog>i{transition:none}}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head-bg);color:var(--head-ink)}
.hdr .wrap{padding-block:10px 12px;display:flex;flex-direction:column;gap:8px}
.hdr .top{display:flex;align-items:center;gap:10px}
.hdr .ttl{font-family:var(--f-display);font-size:1.12rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ttl small{display:block;font-family:var(--f-body);font-size:.8rem;color:var(--head-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--head-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:22px;height:22px}
.dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--pulse);color:#fff;font-size:.75rem;font-weight:700;display:grid;place-items:center}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.flag{font-size:.82rem;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);color:var(--head-ink)}
.flag.alert{background:var(--pulse);border-color:transparent;color:#fff}
.flag b{font-weight:600}
.proxybar{background:var(--warn-soft);color:var(--ink);border-bottom:2px solid var(--warn)}
.proxybar .wrap{padding-block:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.proxybar span{font-size:.95rem}

/* ---------- main & cards ---------- */
main{padding-block:16px 110px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none;background:var(--surface-2);border-color:transparent}
.card.tone-ok{border-left:6px solid var(--ok)} .card.tone-warn{border-left:6px solid var(--warn)} .card.tone-bad{border-left:6px solid var(--bad)} .card.tone-none{border-left:6px solid var(--none)}
.eyebrow{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.big{font-family:var(--f-display);font-size:2rem;line-height:1.1}
.big small{font-family:var(--f-body);font-size:.95rem;color:var(--ink-2);margin-left:4px}

.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;font-weight:600;font-size:.9rem;white-space:nowrap}
.badge::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)} .b-none{background:var(--none-soft);color:var(--none)}
.chip{display:inline-flex;align-items:center;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.95rem;min-height:40px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip .n{margin-left:6px;font-weight:700}

/* ---------- buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:12px;border:1px solid transparent;background:var(--brand);color:var(--on-brand);font-weight:600;font-size:1.02rem;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{filter:brightness(1.05)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--brand-soft);color:var(--brand-deep)}
:root[data-theme="dark"] .btn.soft{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.soft{color:var(--ink)}}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.92rem}
.btn.light{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn svg{width:20px;height:20px;flex:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{font-weight:600;font-size:.98rem}
.req{font-style:normal;color:var(--pulse);font-size:.8rem;font-weight:600;margin-left:4px}
.hint{color:var(--ink-2);font-size:.85rem}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=search],input[type=date],select,textarea{width:100%;min-height:50px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.02rem}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:.8fr 1.4fr 1fr;gap:8px}
.f2 > *, .f3 > *{min-width:0}
@media (max-width:380px){.f2{grid-template-columns:1fr}}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.col{flex-direction:column}
.opt{position:relative;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:flex;align-items:center;min-height:46px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.opt input:checked + span{border-color:var(--brand);background:var(--brand-soft);font-weight:600}
.opt input:focus-visible + span{outline:3px solid var(--brand);outline-offset:2px}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--brand-soft);border:1px solid var(--line);gap:4px}
.seg button{flex:1;min-height:46px;border:0;border-radius:10px;background:var(--surface);cursor:pointer;font-weight:600;color:var(--ink);padding:6px 8px}
.seg button:hover{background:var(--seg-hover)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);box-shadow:var(--shadow)}
.proxy-mini{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;border:1px dashed var(--line);background:var(--surface)}
.proxy-mini svg{width:20px;height:20px;color:var(--brand);flex:none}
.proxy-mini span{flex:1;min-width:0;font-size:.92rem;color:var(--ink-2)}
.msg{padding:10px 14px;border-radius:12px;font-size:.95rem}
.msg.err{background:var(--bad-soft);color:var(--bad)} .msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.info{background:var(--surface-2);color:var(--ink-2)} .msg.warn{background:var(--warn-soft);color:var(--warn)}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details > summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"＋";color:var(--brand)}
details[open] > summary::after{content:"－"}
details > .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:.85rem}
tr.hl td{background:var(--brand-soft);font-weight:600}
tr.hl td:first-child{box-shadow:inset 4px 0 0 var(--brand)}

/* ---------- tiles / lists ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-height:122px;box-shadow:var(--shadow)}
.tile .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.tile .ic svg{width:22px;height:22px}
.tile b{font-family:var(--f-display);font-weight:500;font-size:1.02rem}
.tile .v{font-size:.9rem;color:var(--ink-2)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li.click{cursor:pointer}
.pcard{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.pcard:hover{border-color:var(--brand)}
.pcard .grow{flex:1;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);flex:none;background:var(--surface-2);color:var(--ink-2)}
.avatar.ok{background:var(--ok-soft);color:var(--ok)} .avatar.warn{background:var(--warn-soft);color:var(--warn)} .avatar.bad{background:var(--bad-soft);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.kpi .k{font-size:.88rem;color:var(--ink-2)}
.kpi .v{font-family:var(--f-display);font-size:1.8rem;line-height:1.15}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}
.stackbar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.stackbar i{display:block;height:100%}
.meter{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)}
.bubble{padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:.95rem}
.bubble.staff{background:var(--brand-soft)}
.bubble .who{font-size:.8rem;color:var(--ink-2);font-weight:600}
.phone{font-family:var(--f-display);font-size:1.6rem;letter-spacing:.04em;user-select:all}
.mapbox{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.preview-img{max-height:260px;width:auto;border-radius:12px;align-self:flex-start}
.foodrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.foodrow:last-child{border-bottom:0}
.foodrow .grow{flex:1;min-width:0}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem}
.sumgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sumgrid > div{display:flex;flex-direction:column;gap:4px;min-width:0}
.sumgrid .v{font-family:var(--f-display);font-size:1.3rem}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar nav{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;border:0;background:transparent;color:var(--ink-2);font-size:.78rem;cursor:pointer;min-height:62px}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--brand);font-weight:700}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:4px 0;font-size:1rem}
.back svg{width:20px;height:20px}
.auth-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:24px 8px}
.auth-hero .lockup img{width:64px;height:64px}
.auth-hero .brandname{font-size:1.9rem}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-title h2,.sec-title h3{flex:1;min-width:0}
#result,#formMsg,#regMsg{scroll-margin-top:170px}
.footnote{font-size:.82rem;color:var(--ink-2);text-align:center}
@media (min-width:900px){ body.wide .cols{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start} body.wide .cols > *{min-width:0} }

/* ---------- refinement: softer surfaces, balanced logo sizes ---------- */
h2{color:var(--brand-deep)}
:root[data-theme="dark"] h2{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h2{color:var(--ink)}}
.splash{gap:18px;background:radial-gradient(90% 60% at 50% 18%,var(--brand-soft),var(--bg) 72%)}
.capsule{display:flex;align-items:center;gap:14px;padding:14px 22px;border-radius:28px;background:var(--surface);box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.capsule .x{font-family:var(--f-display);font-size:1.15rem;color:var(--ink-2);opacity:.7}
.capsule img{width:68px;height:68px;display:block}
.capsule svg{display:block}
.auth-hero .capsule{padding:10px 18px;gap:10px;border-radius:22px;box-shadow:var(--shadow)}
.auth-hero .capsule img{width:50px;height:50px}
.auth-hero .brandname{font-size:1.75rem}
.brandname{font-size:2.15rem}
.ecg{width:min(220px,70%);height:40px;opacity:.85}
.hdr{background:var(--head-grad);border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(12,80,45,.18)}
.hdr .wrap{padding-block:12px 14px}
.hlogo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.16);flex:none}
.iconbtn{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.12);border-radius:14px}
.flag{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.18)}
.proxybar{border-radius:0}
main{padding-block:20px 116px}
.card{border-color:var(--line);box-shadow:var(--shadow);padding:18px;gap:12px}
.card.flat{background:var(--surface-2)}
.card.tone-ok,.card.tone-warn,.card.tone-bad,.card.tone-none{border-left-width:5px}
.tile{border-radius:var(--r);border-color:var(--line);box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.tile .ic{width:42px;height:42px;border-radius:14px}
.kpi{border-radius:var(--r);box-shadow:var(--shadow);transition:box-shadow .15s ease}
.kpi:hover{box-shadow:var(--shadow-lg)}
.pcard{border-radius:16px;box-shadow:var(--shadow)}
.btn{border-radius:14px;transition:filter .15s ease,box-shadow .15s ease}
.btn:not(.ghost):not(.soft):not(.light):not(.danger){background:linear-gradient(180deg,var(--brand),var(--brand-deep));box-shadow:0 4px 12px rgba(20,131,75,.22)}
.btn.ghost{background:var(--surface)}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=search],input[type=date],select,textarea{border-radius:14px;background:var(--input-bg);border-color:var(--line)}
input:focus,select:focus,textarea:focus{background:var(--surface)}
.opt span{border-radius:14px;border-width:1.5px;background:var(--surface)}
.seg{border-radius:16px}
.seg button{border-radius:12px}
details{border-radius:16px;border-color:var(--line)}
.msg{border-radius:14px}
.tabbar{background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(16,70,40,.06)}
.tabbar button{gap:4px;padding:8px 2px 10px}
.tabbar button svg{width:54px;height:30px;padding:4px 15px;border-radius:99px;box-sizing:border-box;transition:background .15s ease}
.tabbar button[aria-current="page"] svg{background:var(--brand-soft)}
@media (prefers-reduced-motion: reduce){.tile,.kpi,.btn,.tabbar button svg{transition:none}.tile:hover{transform:none}}
.contact-row{display:flex;align-items:center;gap:12px}
.contact-row .grow{flex:1;min-width:0}
.ic-round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.ic-round svg{width:20px;height:20px}
.contact-num{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.03em;user-select:all}

/* ---------- colorful icon set ---------- */
:root{ --rose:#e0485a; --rose-s:#fde7ea; --sky:#2f7fd0; --sky-s:#e2eefb; --orange:#e2771c; --orange-s:#fdeedd; --violet:#7656d0; --violet-s:#efeafc; --amber:#c18a07; --amber-s:#fbf1d4; --teal:#11898a; --teal-s:#dcf3f1; --green:#18874e; --green-s:#e1f3e8 }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --rose:#ff7d8b; --rose-s:#3a1c22; --sky:#6fb0f2; --sky-s:#182b3f; --orange:#f5a15b; --orange-s:#38261a; --violet:#a991f2; --violet-s:#272042; --amber:#e8bb48; --amber-s:#352b12; --teal:#4fcfca; --teal-s:#123332; --green:#55c584; --green-s:#173424 }}
:root[data-theme="dark"]{ --rose:#ff7d8b; --rose-s:#3a1c22; --sky:#6fb0f2; --sky-s:#182b3f; --orange:#f5a15b; --orange-s:#38261a; --violet:#a991f2; --violet-s:#272042; --amber:#e8bb48; --amber-s:#352b12; --teal:#4fcfca; --teal-s:#123332; --green:#55c584; --green-s:#173424 }
.c-rose{--ic:var(--rose);--ic-s:var(--rose-s)} .c-sky{--ic:var(--sky);--ic-s:var(--sky-s)} .c-orange{--ic:var(--orange);--ic-s:var(--orange-s)}
.c-violet{--ic:var(--violet);--ic-s:var(--violet-s)} .c-amber{--ic:var(--amber);--ic-s:var(--amber-s)} .c-teal{--ic:var(--teal);--ic-s:var(--teal-s)} .c-green{--ic:var(--green);--ic-s:var(--green-s)}
.tile .ic[class*="c-"], .ic-round[class*="c-"]{background:var(--ic-s);color:var(--ic)}
.tile .ic{width:46px;height:46px;border-radius:15px}
.tile .ic svg{width:24px;height:24px}
.tile:hover{border-color:var(--line)}
.li .ic-round{margin-top:2px}
.tabbar button[class*="c-"][aria-current="page"]{color:var(--ic)}
.tabbar button[class*="c-"][aria-current="page"] svg{background:var(--ic-s)}
.tabbar button[class*="c-"]:not([aria-current]):hover{color:var(--ic)}

/* ---------- groups, clock, appointments, visits, knowledge ---------- */
:root{ --sus:#d0621b; --sus-soft:#fdebdc; }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --sus:#f4a066; --sus-soft:#3a2416 }}
:root[data-theme="dark"]{ --sus:#f4a066; --sus-soft:#3a2416 }
.b-sus{background:var(--sus-soft);color:var(--sus)} .b-info{background:var(--sky-s);color:var(--sky)}
.avatar.sus{background:var(--sus-soft);color:var(--sus)} .card.tone-sus{border-left:5px solid var(--sus)} .kpi.sus .v{color:var(--sus)}
.vcell.t-sus b{color:var(--sus)}
.clock{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--head-ink-2)}
.clock svg{width:15px;height:15px;flex:none}
.clock.on-page{justify-content:center;color:var(--ink-2);padding-top:12px}
input[type=time]{width:100%;min-height:50px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--input-bg);font-size:1.02rem}
.tabbar button{font-size:.72rem}
.tabbar button svg{width:46px;padding:4px 11px}
.appt{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.appt.cancelled,.appt.missed{opacity:.8}
.appt-date{width:62px;flex:none;display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-radius:14px;background:var(--rose-s);color:var(--rose)}
.appt-date b{font-family:var(--f-display);font-size:1.6rem;line-height:1}
.appt-date span{font-weight:600;font-size:.9rem}
.appt-date small{font-size:.72rem;opacity:.8}
.appt.done .appt-date{background:var(--ok-soft);color:var(--ok)}
.visit{gap:10px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.vcell{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--surface-2);min-width:0}
.vcell b{font-family:var(--f-display);font-weight:500;font-size:1.15rem}
.vcell small{font-size:.8rem;color:var(--ink-2)}
.vcell.t-ok b{color:var(--ok)} .vcell.t-warn b{color:var(--warn)} .vcell.t-bad b{color:var(--bad)}
.spark svg{width:100%;height:auto;display:block}

.kb-card{display:flex;flex-direction:column;gap:6px;padding:12px 12px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:left;cursor:pointer}
.kb-card b{font-family:var(--f-display);font-weight:500;font-size:1.08rem;color:var(--ic)}
.kb-card:hover{box-shadow:var(--shadow-lg)}
.kb-art svg{width:100%;height:auto;display:block;border-radius:14px}
.kb-meta{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.kb-hero{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.kb-hero h2{color:var(--ic)}
.kb-hero p{max-width:65ch}
.kb-sec h3{display:flex;align-items:center;gap:10px}
.kb-ul,.kb-ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.kb-ol li::marker{font-weight:700;color:var(--brand)}
.kb-chips{display:flex;flex-wrap:wrap;gap:6px}
.kb-chips span{padding:4px 12px;border-radius:99px;background:var(--surface-2);font-size:.92rem}
.kb-duo,.kb-trio,.kb-if{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kb-duo > div,.kb-trio > div,.kb-if > div{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:14px;background:var(--surface-2);min-width:0}
.kb-duo b,.kb-trio b,.kb-if b{font-family:var(--f-display);font-size:1.5rem;font-weight:500;color:var(--brand)}
.kb-trio > div{align-items:center;text-align:center}
.kb-if small{color:var(--ink-2);font-size:.85rem}
.kb-organs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kb-organs > div{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:14px;background:var(--ic-s)}
.kb-organs b{color:var(--ic);font-family:var(--f-display);font-weight:500}
.kb-organs small{font-size:.86rem}
.kb-organs .ic-round{background:var(--surface);color:var(--ic)}
.kb-befast{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kb-befast > div{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--bad-soft)}
.kb-befast b{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--bad);color:#fff;font-family:var(--f-display)}
.kb-letter{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;background:var(--ic);color:#fff;font-family:var(--f-display);font-weight:500;flex:none}
.kb-moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kb-moves > div{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:12px;border-radius:14px;background:var(--orange-s)}
.kb-moves .kb-num{grid-row:span 2;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-weight:700}
.kb-moves small{font-size:.86rem;color:var(--ink-2)}
.kb-gauge svg{width:min(320px,100%);height:auto;display:block;margin:0 auto}
.kb-plate svg{width:min(380px,100%);height:auto;display:block;margin:0 auto;border-radius:14px}
.breath{display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:10px}
.breath-ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--violet-s),var(--surface-2));border:3px solid var(--violet);color:var(--violet);font-weight:600;text-align:center;transition:transform 4s ease-in-out}
.kb-videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.vid{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.vid:hover{border-color:var(--ic)}
.vid-thumb{width:72px;height:50px;flex:none;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ic),var(--rose));color:#fff}
.vid-thumb svg{width:24px;height:24px}
.vid-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.vid-txt b{font-weight:600;font-size:.95rem;line-height:1.35}
.vid-txt small{color:var(--ink-2);font-size:.8rem}
.kb-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.kb-mini{flex:0 0 200px;scroll-snap-align:start;display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:16px;border:0;background:var(--ic-s);text-align:left;cursor:pointer}
.kb-mini b{color:var(--ic);font-family:var(--f-display);font-weight:500;font-size:.98rem;line-height:1.35}
@media (prefers-reduced-motion: reduce){.breath-ring{transition:none}}
.kb-sec table{min-width:460px}

.attach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.attach-grid:empty{display:none}
.attach-grid.view{margin-top:8px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.attach-item{position:relative;display:block;aspect-ratio:1/1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.attach-grid.view .attach-item:has(video){aspect-ratio:16/10}
.attach-item img,.attach-item video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.attach-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:1.1rem;line-height:1;cursor:pointer}
.attach-tag{position:absolute;left:4px;bottom:4px;padding:1px 8px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem}
.attach-btn{cursor:pointer}

.step-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.step-ringwrap{position:relative;width:130px;height:130px;flex:none}
.step-ring{width:100%;height:100%}
.step-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.step-center b{font-family:var(--f-display);font-size:1.6rem;font-weight:500;color:var(--orange)}
.step-center small{font-size:.8rem;color:var(--ink-2)}
.step-chart svg{width:100%;height:auto;display:block}

.face{display:inline-grid;place-items:center;width:26px;height:26px;vertical-align:middle;border-radius:50%}
.face svg{width:22px;height:22px}
.face.big{width:44px;height:44px;flex:none}
.face.big svg{width:38px;height:38px}
.face.t-ok{color:var(--ok)} .face.t-warn{color:var(--warn)} .face.t-bad{color:var(--bad)}
.saltm-row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.saltm-row.t-ok{background:var(--ok-soft)} .saltm-row.t-warn{background:var(--warn-soft)} .saltm-row.t-bad{background:var(--bad-soft)}

.saltm-in{display:flex;flex-direction:column;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}

.vid-open{display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(135deg,var(--violet),var(--rose))!important;color:#fff;text-decoration:none}

async function hashPin(phone,pin){
  const txt = digits(phone)+":"+pin+":pvht";
  try{ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=0; for(const ch of txt){ h=(h*31+ch.charCodeAt(0))|0; } return "x"+h; }
}

const Api = (()=>{
  const url = window.PVHT_API || null;
  let sid = (()=>{ try{ return localStorage.getItem("pvht-sid")||null; }catch(e){ return null; } })();
  let queue=[], timer=null;
  async function post(body){
    const r = await fetch(url, {method:"POST", body:JSON.stringify({...body, sid}), redirect:"follow"});
    const j = await r.json();
    if(j && j.error==="auth" && S.session){ setTimeout(()=>{ logout(); S.auth.msg=["warn","หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบอีกครั้ง"]; render(); },0); }
    return j;
  }
  function flush(){
    const q=queue; queue=[]; timer=null; if(!q.length) return;
    post({op:"batch", ops:q.map(x=>x.op)}).then(j=>{
      q.forEach((x,i)=>{ const r=j&&j.results?j.results[i]:null; if(r&&r.ok) x.res(r); else x.rej(new Error((r&&r.error)||(j&&j.error)||"network")); });
    }).catch(e=>q.forEach(x=>x.rej(e)));
  }
  return {
    get on(){ return !!url; },
    get sid(){ return sid; },
    setSid(v){ sid=v||null; try{ v?localStorage.setItem("pvht-sid",v):localStorage.removeItem("pvht-sid"); }catch(e){} },
    call: post,
    op(o){ return new Promise((res,rej)=>{ queue.push({op:o,res,rej}); if(!timer) timer=setTimeout(flush,25); }); }
  };
})();
const Poller = (()=>{
  const ws=new Set(); let t=null, busy=false;
  const key=w=>w.path||(w.col+JSON.stringify(w.q||{}));
  async function tick(force){
    if(busy || !ws.size) return; if(document.hidden && !force) return;
    const now=Date.now(), due=[...ws].filter(w=>force||now-w.at>=w.every); if(!due.length) return;
    busy=true;
    try{
      await Promise.all(due.map(async w=>{
        w.at=Date.now();
        try{
          const r = w.path ? await Api.op({op:"get",path:w.path}) : await Api.op({op:"list",col:w.col,q:w.q||{}});
          const val = w.path ? (r.doc||null) : (r.docs||[]); const sig=JSON.stringify(val);
          if(sig!==w.sig){ w.sig=sig; w.cb(val); }
        }catch(e){ if(w.sig===undefined){ w.sig="[]"; w.cb(w.path?null:[]); } }
      }));
    } finally { busy=false; }
  }
  return {
    add(w){ w.at=0; w.every = /^events/.test(w.col||"") ? 60000 : 8000; ws.add(w); if(!t) t=setInterval(()=>tick(false),2000); clearTimeout(this._k); this._k=setTimeout(()=>tick(true),30); return ()=>ws.delete(w); },
    poke(){ clearTimeout(this._p); this._p=setTimeout(()=>tick(true),300); }
  };
})();
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) Poller.poke(); });

const Store = (()=>{
  let mode="local", db=null, mem={};
  const LK="pvht-store-v1", listeners=new Set();
  const loadLocal=()=>{ mem = lsGet(LK,{}) || {}; };
  const saveLocal=()=>{ lsSet(LK,mem); listeners.forEach(f=>{ try{f();}catch(e){} }); };
  const clean = o => JSON.parse(JSON.stringify(o));
  const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  function colDocs(col){ const pre=col+"/"; return Object.keys(mem).filter(k=>k.startsWith(pre) && !k.slice(pre.length).includes("/")).map(k=>({id:k.slice(pre.length), ...mem[k]})); }
  function applyQ(arr,q={}){
    if(q.where) arr=arr.filter(d=>d[q.where[0]]===q.where[2]);
    if(q.orderBy){ const f=q.orderBy, s=q.desc?-1:1; arr.sort((a,b)=>((a[f]??0)>(b[f]??0)?1:(a[f]??0)<(b[f]??0)?-1:0)*s); }
    if(q.limit) arr=arr.slice(0,q.limit);
    return arr;
  }
  function ref(col,q={}){ let r=db.collection(col); if(q.where) r=r.where(q.where[0],q.where[1],q.where[2]); if(q.orderBy) r=r.orderBy(q.orderBy,q.desc?"desc":"asc"); if(q.limit) r=r.limit(q.limit); return r; }
  window.addEventListener("storage", e=>{ if(e.key===LK && mode==="local"){ loadLocal(); listeners.forEach(f=>f()); } });
  return {
    get mode(){ return mode; }, uid,
    async init(){
      loadLocal();
      if(Api.on){ mode="api"; return mode; }
      try{ if(window.claude && window.claude.use){ const d = await window.claude.use("db"); if(d){ db=d; mode="db"; } } }catch(e){}
      return mode;
    },
    async get(path){ if(mode==="api"){ const r=await Api.op({op:"get",path}); return r.doc||null; } if(mode==="db"){ const s=await db.doc(path).get(); return s.exists?{id:s.id,...s.data()}:null; } return mem[path]?{id:path.split("/").pop(),...mem[path]}:null; },
    async set(path,data){ data=clean(data); delete data.id; if(mode==="api"){ await Api.op({op:"set",path,data}); Poller.poke(); return; } if(mode==="db") return db.doc(path).set(data); mem[path]=data; saveLocal(); },
    async update(path,data){ data=clean(data); delete data.id; if(mode==="api"){ await Api.op({op:"update",path,data}); Poller.poke(); return; } if(mode==="db") return db.doc(path).update(data); mem[path]={...(mem[path]||{}),...data}; saveLocal(); },
    async del(path){ if(mode==="api"){ await Api.op({op:"del",path}); Poller.poke(); return; } if(mode==="db") return db.doc(path).delete(); delete mem[path]; saveLocal(); },
    async list(col,q={}){ if(mode==="api"){ const r=await Api.op({op:"list",col,q}); return r.docs||[]; } if(mode==="db"){ const s=await ref(col,q).get(); return s.docs.map(d=>({id:d.id,...d.data()})); } return applyQ(colDocs(col),q); },
    watch(col,q,cb){
      if(mode==="api") return Poller.add({col,q,cb});
      if(mode==="db"){ return ref(col,q).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))), e=>console.warn("watch",col,e)); }
      const f=()=>cb(applyQ(colDocs(col),q)); listeners.add(f); f(); return ()=>listeners.delete(f);
    },
    watchDoc(path,cb){
      if(mode==="api") return Poller.add({path,cb});
      if(mode==="db"){ return db.doc(path).onSnapshot(s=>cb(s.exists?{id:s.id,...s.data()}:null), e=>console.warn("watchDoc",path,e)); }
      const f=()=>cb(mem[path]?{id:path.split("/").pop(),...mem[path]}:null); listeners.add(f); f(); return ()=>listeners.delete(f);
    }
  };
})();

    ["ความดันโลหิตสูง ระดับ 2","bad","ความดันสูงมาก ควรพบแพทย์โดยเร็วภายใน 1 สัปดาห์"],
    ["ความดันโลหิตสูง ระดับ 3","bad","อันตราย ควรพบแพทย์ทันที หากปวดศีรษะรุนแรง เจ็บหน้าอก แขนขาอ่อนแรง โทร 1669"]
  ][i];

function bmiClass(b){
  if(b<18.5) return {i:0,label:"น้ำหนักน้อย/ผอม",tone:"warn",advice:"ควรกินอาหารให้ครบ 5 หมู่และเพียงพอ"};

  if(b<30) return {i:3,label:"อ้วนระดับ 1",tone:"bad",advice:"เสี่ยงต่อความดันโลหิตสูงและเบาหวาน ควรลดน้ำหนัก 5–10%"};
  return {i:4,label:"อ้วนระดับ 2",tone:"bad",advice:"เสี่ยงสูง ควรปรึกษาเจ้าหน้าที่เพื่อวางแผนลดน้ำหนัก"};
}
const waistLimit = sex => sex==="หญิง" ? 80 : 90;
function waistClass(w,sex,h){
  const lim=waistLimit(sex), over = w>=lim, ratio = h? w/h : null;
  return { over, lim, ratio, tone: over?"bad":(ratio&&ratio>=0.5?"warn":"ok"),

function saltClass(s){
  if(s<=9) return {label:"บริโภคเค็มน้อย",tone:"ok",advice:"ดีมาก รักษาพฤติกรรมนี้ไว้"};
  if(s<=19) return {label:"บริโภคเค็มปานกลาง",tone:"warn",advice:"ควรลดปลาร้า น้ำปลา ผงปรุงรส และไม่ซดน้ำแกงจนหมด"};
  return {label:"บริโภคเค็มมาก",tone:"bad",advice:"เสี่ยงความดันโลหิตสูงมาก ควรลดเค็มทันที ชิมก่อนปรุงทุกครั้ง และลดอาหารแปรรูป"};

function auditClass(score,sex,q1){
  const th = sex==="หญิง"?3:4;
  if(!q1 || q1==="0") return {label:"ไม่ดื่มสุรา",tone:"ok",risky:false};
  if(score>=8) return {label:"ดื่มแบบเสี่ยงสูง",tone:"bad",risky:true};
  if(score>=th) return {label:"ดื่มแบบเสี่ยง",tone:"warn",risky:true};
  return {label:"ดื่มแบบความเสี่ยงต่ำ",tone:"ok",risky:false};
}
function computeRisk(p){
  const L=p.latest||{}, reasons=[], factors=[];
  let level="none", urgent=false, any=false;
  const age = ageOf(p.dob)?.y;
  if(L.bp){ any=true; const c=bpClass(L.bp.sys,L.bp.dia); urgent=c.urgent; level=c.risk; reasons.push(`ความดัน ${L.bp.sys}/${L.bp.dia} มม.ปรอท (${c.label})`); }
  if(L.body){ any=true; if(L.body.bmi>=25) factors.push(`BMI ${L.body.bmi.toFixed(1)} (${bmiClass(L.body.bmi).label})`); }
  if(L.waist){ any=true; if(L.waist.over) factors.push(`รอบเอว ${L.waist.cm} ซม. เกินเกณฑ์`); }
  if(L.family){ any=true; if(L.family.positive) factors.push("พ่อ แม่ หรือพี่น้องเป็นความดันโลหิตสูง"); }
  if(L.salt){ any=true; if(L.salt.score>=20) factors.push("บริโภคเค็มมาก"); }

async function startSession(sess, fresh=true){

    const me = await Store.get(`patients/${sess.id}`);
    if(!me){ logout(); return; }
    S.me=me;
    unsubs.push(Store.watchDoc(`patients/${sess.id}`, d=>{ if(d){ S.me=d; onData(); } }));
    unsubs.push(Store.watch("messages", {where:["pid","==",sess.id]}, d=>{ S.messages=d; onData(); }));
    unsubs.push(Store.watch("appointments", {where:["pid","==",sess.id]}, d=>{ S.appts=d; onData(); }));
    unsubs.push(Store.watch("staff", {}, d=>{ S.staffList=d; onData(); }));
    subscribeSubject(sess.id);
    if(fresh){ await Store.update(`patients/${sess.id}`, {lastLogin:Date.now(), loginCount:(me.loginCount||0)+1}); logEvent("login"); }
    go("p-home", {}, true);

    S.me=me; S.scope = sess.role==="vhv" ? "mine" : "all";
    unsubs.push(Store.watchDoc(`staff/${sess.id}`, d=>{ if(d){ S.me=d; } }));
    unsubs.push(Store.watch("patients", {}, d=>{ S.patients=d; onData(); }));
    unsubs.push(Store.watch("messages", {}, d=>{ S.messages=d; onData(); }));
    unsubs.push(Store.watch("appointments", {}, d=>{ S.appts=d; onData(); }));

    out.push(L.alcohol.drug==="yes" ? `<span class="flag alert">ใช้สารเสพติด${L.alcohol.drugTypes?.length?": "+esc(L.alcohol.drugTypes.join(", ")):""}</span>` : (L.alcohol.drug==="past"?`<span class="flag">เคยใช้สารเสพติด (เลิกแล้ว)</span>`:`<span class="flag">ไม่ใช้สารเสพติด</span>`));

function tabbar(patientView){

  const cur = sc.startsWith("a-") ? "p-assess" : sc.startsWith("k-") ? (patientView?"k-list":"s-me") : ["s-patient","s-visit","s-visits"].includes(sc) ? "s-patients" : sc==="appt-form" ? "s-appts" : ["p-history","p-visits"].includes(sc) ? "p-me" : sc==="p-appts" ? "p-home" : sc;

      body += `<div class="field"><span class="lab">เข้าสู่ระบบด้วย</span>${seg("authMethod",a.method,[["name","ชื่อ-สกุล"],["phone","เบอร์โทร"],["cid","เลขบัตรประชาชน"]])}</div>

  } else {
    if(a.proxyHint) body += `<div class="msg info">เข้าสู่ระบบด้วยบัญชี ${roleTH(a.role)} แล้วค้นหาผู้รับบริการ จากนั้นกด “ใช้งานแทน”</div>`;

          : fld("เบอร์โทรศัพท์",`<input type="tel" id="ls-phone" name="phone" inputmode="numeric" required>`)}
        ${fld("รหัส PIN",`<input type="password" id="ls-pin" name="pin" inputmode="numeric" maxlength="5" autocomplete="off" required>`,{req:1,hint:"PIN 5 หลักของ อสม./เจ้าหน้าที่ ขอได้จาก ${RPH.short}"})}

      ${a.matches ? `<div class="card flat"><b>พบหลายบัญชี กรุณาเลือกให้ถูกคน</b>${a.matches.map(x=>`<button class="pcard" data-act="pickStaff" data-id="${x.id}"><div class="avatar">${esc((x.first||"?")[0])}</div><div class="grow"><b>${esc(fullName(x))}</b><div class="small muted">${roleTH(x.role)} · โทร ${fmtPhone(x.phone).replace(/^(\d{3})-\d{3}/,"$1-xxx")}${x.area?" · "+esc(x.area):""}</div></div></button>`).join("")}</div>`:""}`;
    } else {
      body += `<div class="card flat"><p>ลงทะเบียนบัญชี ${roleTH(a.role)} ด้วยชื่อ-สกุล เลขบัตรประชาชน และเบอร์โทร แล้วใช้ข้อมูลเหล่านี้เข้าสู่ระบบได้ทุกครั้ง</p><button class="btn block" data-go="register-staff" data-p='{"role":"${a.role}"}'>เริ่มลงทะเบียน ${roleTH(a.role)}</button></div>`;
    }
  }
  return `${clockHTML("on-page")}<div class="auth-hero"><div class="capsule">${appLogo(50)}<span class="x" aria-hidden="true">×</span><img src="${MOH_LOGO}" alt="ตรากระทรวงสาธารณสุข"></div>${brandName()}<p class="muted"><span class="oneline" style="display:block;color:var(--ink);font-weight:600">${RPH.name}</span><span class="small">${RPH.addr}</span></p></div>
  <div class="field"><span class="lab">เลือกประเภทผู้ใช้งาน</span>${seg("authRole",a.role,[["patient","ผู้รับบริการ"],["vhv","อสม."],["staff","เจ้าหน้าที่"]])}</div>
  ${a.msg?`<div class="msg ${a.msg[0]}" role="alert">${a.msg[1]}</div>`:""}
  ${body}
  <p class="footnote">ติดต่อ ${RPH.short} โทร <span class="num">${RPH.phone}</span>${Store.mode==="local"?"<br>โหมดทดลอง: ข้อมูลเก็บเฉพาะในเครื่องนี้":""}</p>`;
}

function scrPHome(){
  const p=P(); if(!p) return `<p>ไม่พบข้อมูล</p>`;
  const L=p.latest||{}, r=p.risk||{level:"none",reasons:["ยังไม่ได้ทำแบบประเมิน"]};
  const tone=RISK[r.level||"none"][1];
  const ref=p.referral;
  const tiles=ASSESS.map(a=>`<button class="tile" data-go="${a.id}"><span class="ic ${a.c}">${a.icon}</span><b>${a.title}</b><span class="v">${a.summary(L[a.key],p)}</span></button>`).join("");
  const fd=foodTotals(S.food?.items||[]);
  return `
  ${r.urgent?`<div class="msg err" role="alert"><b>ความดันสูงอันตราย</b> ควรพบแพทย์ทันที หากมีอาการปวดศีรษะรุนแรง เจ็บหน้าอก ตามัว แขนขาอ่อนแรง โทร <b>1669</b></div>`:""}
  <section class="card tone-${tone}">
    <div class="spread"><span class="eyebrow">ระดับความเสี่ยงโรคความดันโลหิตสูง</span>${riskBadge(r.level)}</div>
    <ul style="margin:0;padding-left:1.2em" class="small">${(r.reasons||[]).map(x=>`<li>${esc(x)}</li>`).join("")||"<li>ไม่พบปัจจัยเสี่ยง</li>"}</ul>

  </section>

    ${(()=>{ const st=stepsOn(dayKey()), g=p.stepGoal||8000; return `<div class="spread"><span class="big num">${nf(st)}<small>/ ${nf(g)} ก้าว</small></span><span class="small muted">${st>=g?"ถึงเป้าหมายแล้ว":"อีก "+nf(g-st)+" ก้าว"}</span></div><div class="meter"><i style="width:${Math.min(100,st/g*100)}%"></i></div>`; })()}</section>
  <div class="grid2">

/* =================== ASSESSMENTS =================== */
const ASSESS = [
  {id:"a-bp", c:"c-rose", key:"bp", title:"ความดันโลหิต", icon:I.heart, summary:(v)=>v?`${v.sys}/${v.dia} · ${bpClass(v.sys,v.dia).label}`:"ยังไม่บันทึก"},
  {id:"a-body", c:"c-sky", key:"body", title:"น้ำหนัก ส่วนสูง BMI", icon:I.scale, summary:(v)=>v?`BMI ${v.bmi.toFixed(1)} · ${bmiClass(v.bmi).label}`:"ยังไม่บันทึก"},
  {id:"a-waist", c:"c-orange", key:"waist", title:"รอบเอว", icon:I.tape, summary:(v)=>v?`${v.cm} ซม. · ${v.over?"เกินเกณฑ์":"ปกติ"}`:"ยังไม่บันทึก"},
  {id:"a-family", c:"c-violet", key:"family", title:"ประวัติครอบครัว", icon:I.family, summary:(v)=>v?(v.positive?"มีคนในครอบครัวเป็นความดันสูง":"ไม่มีประวัติในครอบครัว"):"ยังไม่บันทึก"},
  {id:"a-alcohol", c:"c-amber", key:"alcohol", title:"สุรา บุหรี่ สารเสพติด", icon:I.glass, summary:(v)=>v?v.label:"ยังไม่บันทึก"},
  {id:"a-salt", c:"c-teal", key:"salt", title:"ความเค็มในอาหาร", icon:I.salt, summary:(v,p)=>{ const m=p?.latest?.saltm; const a=v?`${v.score} คะแนน · ${saltClass(v.score).label}`:""; const b=m?`Salt Meter ${m.pct}% · ${saltmClass(m.pct).label}`:""; return [a,b].filter(Boolean).join(" · ")||"ยังไม่บันทึก"; }}
];
function scrPAssess(){
  const p=P(), L=p.latest||{};
  const done=ASSESS.filter(a=>L[a.key]).length;
  return `<h2>แบบประเมินความเสี่ยง</h2>
  <div class="card flat"><div class="spread"><span>ทำแล้ว <b class="num">${done}/${ASSESS.length}</b> หัวข้อ</span>${riskBadge(p.risk?.level)}</div><div class="meter"><i style="width:${done/ASSESS.length*100}%"></i></div></div>
  <div class="list card">${ASSESS.map(a=>`<div class="li click" data-go="${a.id}"><span class="ic-round ${a.c}" aria-hidden="true">${a.icon}</span><div class="grow"><b>${a.title}</b><div class="small muted">${a.summary(L[a.key],p)}${L[a.key]?` · ${ago(L[a.key].at)}`:""}</div></div>${L[a.key]?'<span class="badge b-ok">ทำแล้ว</span>':'<span class="badge b-none">ยังไม่ทำ</span>'}</div>`).join("")}</div>
  <button class="btn ghost block" data-go="p-history">ดูประวัติการประเมินทั้งหมด</button>`;
}
function resultCard(tone,title,valueHTML,label,advice,extra=""){
  return `<section class="card tone-${tone}" id="result" tabindex="-1"><div class="spread"><span class="eyebrow">${title}</span>${toneBadge(tone,label)}</div>${valueHTML}<p>${esc(advice)}</p>${extra}</section>`;
}
const detailsBox = (title, inner, open) => `<details ${open?"open":""}><summary>${title}</summary><div class="in">${inner}</div></details>`;

/* --- BP --- */
function bpTable(hl){
  const rows=[["เหมาะสม","น้อยกว่า 120","น้อยกว่า 80","ปกติดีมาก"],["ปกติ","120–129","80–84","กลุ่มเสี่ยง"],["สูงกว่าปกติ","130–139","85–89","กลุ่มเสี่ยง"],["ความดันสูง ระดับ 1","140–159","90–99","สงสัยป่วย ส่งพบแพทย์"],["ความดันสูง ระดับ 2","160–179","100–109","ส่งพบแพทย์เร็ว"],["ความดันสูง ระดับ 3","180 ขึ้นไป","110 ขึ้นไป","อันตราย พบแพทย์ทันที"]];
  return `<div class="tbl-wrap"><table><thead><tr><th>ระดับ</th><th>ตัวบน (SBP)</th><th>ตัวล่าง (DBP)</th><th>ความหมาย</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${i===hl?"hl":""}"><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</tbody></table></div>
  <p class="small muted">หน่วย มิลลิเมตรปรอท (มม.ปรอท) อ้างอิงแนวทางสมาคมความดันโลหิตสูงแห่งประเทศไทย ถ้าตัวบนและตัวล่างอยู่คนละระดับ ให้ใช้ระดับที่สูงกว่า ระบบใช้ค่าเฉลี่ยของการวัด 2 ครั้งเมื่อมีการวัดซ้ำ</p>
  <p class="small muted">วิธีวัดที่ถูกต้อง: งดกาแฟ บุหรี่ และออกกำลังกาย 30 นาทีก่อนวัด นั่งพัก 5 นาที หลังพิงพนัก เท้าวางราบ แขนวางบนโต๊ะระดับหัวใจ ไม่พูดคุยขณะวัด</p>`;
}
function scrBP(){
  const p=P(), v=p.latest?.bp;
  const res = S.params.saved && v ? (()=>{ const c=bpClass(v.sys,v.dia); return resultCard(c.tone,"ผลการวัดความดันโลหิต",`<div class="big num">${v.sys}/${v.dia}<small>มม.ปรอท${v.pulse?` · ชีพจร ${v.pulse} ครั้ง/นาที`:""}</small></div>${v.r2?`<p class="small muted num">ครั้งที่ 1: ${v.r1.sys}/${v.r1.dia} · ครั้งที่ 2: ${v.r2.sys}/${v.r2.dia} (ค่าเฉลี่ย)</p>`:""}`,c.label,c.advice, c.risk==="high"?`<div class="msg err">ระบบแจ้ง อสม. และเจ้าหน้าที่ เพื่อส่งต่อพบแพทย์แล้ว</div>`:""); })() : "";
  return `${backBtn()}<h2>ความดันโลหิต</h2>${res}
  <form data-form="bp" class="stack" autocomplete="off">
   <div class="card"><h3>ครั้งที่ 1</h3>
    <div class="f3" style="grid-template-columns:1fr 1fr 1fr">${fld("ตัวบน",`<input type="number" id="bp1s" name="s1" inputmode="numeric" min="60" max="260" required>`)}${fld("ตัวล่าง",`<input type="number" id="bp1d" name="d1" inputmode="numeric" min="30" max="160" required>`)}${fld("ชีพจร",`<input type="number" id="bp1p" name="p1" inputmode="numeric" min="30" max="200">`)}</div>
    <div id="bp1hint" aria-live="polite"></div>
   </div>
   <div class="card" id="bp2box" hidden><h3>ครั้งที่ 2 (วัดซ้ำเพราะค่าครั้งแรกสูง)</h3>
    <p class="small">นั่งพักอย่างน้อย 5 นาที หายใจช้าๆ แล้ววัดซ้ำที่แขนเดิม</p>
    <div class="row"><button type="button" class="btn sm soft" data-act="restTimer">เริ่มจับเวลาพัก 5 นาที</button><span class="num" id="restOut" aria-live="polite"></span></div>
    <div class="f3" style="grid-template-columns:1fr 1fr 1fr">${fld("ตัวบน",`<input type="number" id="bp2s" name="s2" inputmode="numeric" min="60" max="260">`)}${fld("ตัวล่าง",`<input type="number" id="bp2d" name="d2" inputmode="numeric" min="30" max="160">`)}${fld("ชีพจร",`<input type="number" id="bp2p" name="p2" inputmode="numeric" min="30" max="200">`)}</div>
   </div>
   <div id="formMsg"></div>
   <button class="btn block">บันทึกและแปลผล</button>
  </form>
  ${detailsBox("รายละเอียดการแปลผลความดันโลหิต", bpTable(v?bpClass(v.sys,v.dia).i:-1), !!S.params.saved)}
  ${v&&!S.params.saved?`<p class="small muted">ค่าล่าสุด ${v.sys}/${v.dia} มม.ปรอท เมื่อ ${fmtDT(v.at)}</p>`:""}`;
}
function bpHint(){
  const s=+$("#bp1s")?.value, d=+$("#bp1d")?.value, box=$("#bp2box"), h=$("#bp1hint");
  if(!h) return;
  if(!s||!d){ h.innerHTML=""; box.hidden=true; return; }
  const c=bpClass(s,d); h.innerHTML = `<div class="msg ${c.tone==="bad"?"err":c.tone==="warn"?"warn":"ok"}">ครั้งที่ 1: ${c.label}${c.i>=3?" — ค่าสูง กรุณาพักแล้ววัดครั้งที่ 2":""}</div>`;
  box.hidden = c.i<3;
}

/* --- BODY / BMI --- */
function bmiTable(hl){
  const rows=[["น้อยกว่า 18.5","น้ำหนักน้อย/ผอม"],["18.5–22.9","ปกติ"],["23.0–24.9","น้ำหนักเกิน (ท้วม)"],["25.0–29.9","อ้วนระดับ 1"],["30.0 ขึ้นไป","อ้วนระดับ 2"]];
  return `<div class="tbl-wrap"><table><thead><tr><th>BMI (กก./ม²)</th><th>การแปลผล</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${i===hl?"hl":""}"><td class="num">${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</tbody></table></div>
  <p class="small muted">BMI = น้ำหนัก (กิโลกรัม) ÷ ส่วนสูง (เมตร)² ใช้เกณฑ์สำหรับคนเอเชีย (WHO Asia-Pacific) ซึ่งกรมอนามัยใช้ในประเทศไทย ค่า BMI ตั้งแต่ 25 ขึ้นไปเพิ่มความเสี่ยงความดันโลหิตสูง เบาหวาน และโรคหัวใจ</p>`;
}
function scrBody(){
  const p=P(), v=p.latest?.body;
  const res = S.params.saved && v ? (()=>{ const c=bmiClass(v.bmi); return resultCard(c.tone,"ดัชนีมวลกาย (BMI)",`<div class="big num">${v.bmi.toFixed(1)}<small>กก./ม² · ${v.w} กก. ${v.h} ซม.</small></div><p class="small muted num">น้ำหนักที่เหมาะสมสำหรับส่วนสูงนี้: ${(18.5*(v.h/100)**2).toFixed(1)}–${(22.9*(v.h/100)**2).toFixed(1)} กก.</p>`,c.label,c.advice); })() : "";
  return `${backBtn()}<h2>น้ำหนัก ส่วนสูง และ BMI</h2>${res}
  <form data-form="body" class="stack card" autocomplete="off">
    <div class="f2">${fld("น้ำหนัก (กิโลกรัม)",`<input type="number" id="bw" name="w" step="0.1" min="20" max="250" inputmode="decimal" value="${v?.w??""}" required>`)}${fld("ส่วนสูง (เซนติเมตร)",`<input type="number" id="bh" name="h" step="0.1" min="80" max="230" inputmode="decimal" value="${v?.h??""}" required>`)}</div>
    <div id="bmiLive" class="msg info" aria-live="polite">กรอกน้ำหนักและส่วนสูง ระบบคำนวณ BMI ให้อัตโนมัติ</div>
    <div id="formMsg"></div>
    <button class="btn block">บันทึกและแปลผล</button>
  </form>
  ${detailsBox("รายละเอียดการแปลผล BMI", bmiTable(v?bmiClass(v.bmi).i:-1), !!S.params.saved)}`;
}
function bmiLive(){ const w=+$("#bw")?.value, h=+$("#bh")?.value, o=$("#bmiLive"); if(!o) return; if(w&&h){ const b=w/((h/100)**2), c=bmiClass(b); o.className=`msg ${c.tone==="bad"?"err":c.tone}`; o.innerHTML=`BMI <b class="num">${b.toFixed(1)}</b> · ${c.label}`; } }

/* --- WAIST --- */
function waistTable(sex,cm,h){
  const rows=[["ชาย","น้อยกว่า 90 ซม.","90 ซม. ขึ้นไป"],["หญิง","น้อยกว่า 80 ซม.","80 ซม. ขึ้นไป"]];
  return `<div class="tbl-wrap"><table><thead><tr><th>เพศ</th><th>ปกติ</th><th>เกินเกณฑ์ (อ้วนลงพุง)</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r[0]===sex?"hl":""}"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div>
  <p class="small muted">อีกวิธีที่ใช้ง่าย: รอบเอวไม่ควรเกินครึ่งหนึ่งของส่วนสูง ${h?`(ส่วนสูงของคุณ ${h} ซม. รอบเอวไม่ควรเกิน <b class="num">${(h/2).toFixed(0)}</b> ซม.)`:""}</p>
  <p class="small muted">วิธีวัด: ยืนตรง หายใจออกสบายๆ วัดรอบเอวผ่านสะดือ สายวัดแนบลำตัว ขนานกับพื้น ไม่รัดแน่น</p>`;
}
function scrWaist(){

  return `${backBtn()}<h2>รอบเอว</h2>${res}
  <form data-form="waist" class="stack card" autocomplete="off">
    ${fld("รอบเอว (เซนติเมตร)",`<input type="number" id="wcm" name="cm" step="0.5" min="40" max="200" inputmode="decimal" value="${v?.cm??""}" required>`)}
    ${sexKnown?`<p class="small muted">ใช้เกณฑ์เพศ${p.sex}ตามข้อมูลลงทะเบียน</p><input type="hidden" name="sex" value="${p.sex}">`:grp("เพศ (สำหรับเกณฑ์รอบเอว)",radios("sex",[["ชาย","ชาย"],["หญิง","หญิง"]],v?.sex))}
    <div id="formMsg"></div>
    <button class="btn block">บันทึกและแปลผล</button>
  </form>
  ${detailsBox("รายละเอียดการแปลผลรอบเอว", waistTable(v?.sex||p.sex,v?.cm,h), !!S.params.saved)}`;
}

/* --- FAMILY --- */
function scrFamily(){
  const p=P(), v=p.latest?.family||{};
  const res = S.params.saved && p.latest?.family ? resultCard(v.positive?"warn":"ok","ประวัติครอบครัว",`<p>${v.members?.length?esc(v.members.join(", ")):"ไม่มีคนในครอบครัวเป็นความดันโลหิตสูง"}</p>`, v.positive?"มีความเสี่ยงทางพันธุกรรม":"ไม่มีประวัติ", v.positive?"คนที่พ่อ แม่ หรือพี่น้องเป็นความดันโลหิตสูง มีโอกาสเป็นมากกว่าคนทั่วไป ควรวัดความดันอย่างน้อยปีละ 1 ครั้ง และลดเค็มตั้งแต่ตอนนี้":"ยังควรวัดความดันอย่างน้อยปีละ 1 ครั้ง") : "";
  return `${backBtn()}<h2>ประวัติคนในครอบครัว</h2>${res}
  <form data-form="family" class="stack card">

    ${checks("none",["ไม่มี/ไม่ทราบ"],v.none?["ไม่มี/ไม่ทราบ"]:[])}
    ${grp("โรคอื่นในครอบครัว",checks("others",["เบาหวาน","โรคหัวใจ","อัมพฤกษ์/อัมพาต","โรคไต","ไขมันในเลือดสูง"],v.others||[]))}
    <div id="formMsg"></div>
    <button class="btn block">บันทึก</button>
  </form>
  ${detailsBox("ทำไมประวัติครอบครัวจึงสำคัญ",`<p class="small">ระบบนับเป็นปัจจัยเสี่ยงเมื่อ <b>พ่อ แม่ หรือพี่น้อง</b> เป็นโรคความดันโลหิตสูง เพราะยีนและพฤติกรรมการกินในบ้าน เช่น รสเค็ม มักคล้ายกัน ปู่ย่าตายายและลูกบันทึกไว้เป็นข้อมูลประกอบให้เจ้าหน้าที่</p>`)}`;

/* --- save helper --- */
async function saveAssess(kind, data){
  const p=P(); if(!p) return;
  if(p.demo){ throw new Error("ข้อมูลตัวอย่างบันทึกไม่ได้"); }
  const latest={...(p.latest||{}), [kind]:{...data, at:Date.now(), by:actorLabel()}};
  const np={...p, latest};
  const risk=computeRisk(np);
  const upd={latest, risk, updatedAt:Date.now()};
  if((risk.level==="high"||risk.level==="sick") && (!p.referral || p.referral.status==="none")) upd.referral={status:"pending", at:Date.now(), note:"ระบบแนะนำส่งต่อพบแพทย์จากผลประเมิน", by:"ระบบ"};
  await Store.update(`patients/${p.id}`, upd);
  const rid=Store.uid(), rec={kind, data, risk:risk.level, at:Date.now(), by:actorLabel()};
  await Store.set(`patients/${p.id}/records/${rid}`, rec);
  Store.set(`records_all/${rid}`, {...rec, pid:p.id, pname:fullName(p)}).catch(()=>{});
  logEvent("assess", kind);
  if(S.proxy){ const i=S.patients.findIndex(x=>x.id===p.id); if(i>=0) S.patients[i]={...S.patients[i],...upd}; }
  else if(S.session.role==="patient") S.me={...S.me,...upd};
}

/* =================== FOOD =================== */
function foodTotals(items){ return items.reduce((t,x)=>({kcal:t.kcal+x.kcal*x.qty, carb:t.carb+x.carb*x.qty, na:t.na+x.na*x.qty}),{kcal:0,carb:0,na:0}); }
function kcalTarget(p){
  const b=p.latest?.body, a=ageOf(p.dob)?.y;
  if(!b||!a||!(p.sex==="ชาย"||p.sex==="หญิง")) return {kcal:1800, est:false};
  const bmr = 10*b.w + 6.25*b.h - 5*a + (p.sex==="ชาย"?5:-161);
  let k = bmr*1.375; if(b.bmi>=25) k-=300;
  return {kcal:Math.round(Math.max(1200,k)/10)*10, est:true, bmr:Math.round(bmr)};
}

async function downscale(file,max=1024){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const s=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement("canvas");
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
  } finally { URL.revokeObjectURL(url); }
}
async function analyzePhoto(){
  const ph=S.photo; if(!ph) return;
  ph.state="busy"; $("#photoBox").innerHTML=photoBoxHTML();
  try{
    if(Store.mode==="api"){
      const b64 = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(ph.blob); });
      const r = await Api.call({op:"analyzeFood", type:ph.blob.type||"image/jpeg", b64});
      if(!r.ok) throw new Error({ai_not_configured:"ยังไม่ได้ตั้งค่าระบบ AI วิเคราะห์รูปอาหาร แจ้งเจ้าหน้าที่ รพ.สต. ระหว่างนี้ใช้การค้นหาเมนูหรือกรอกเองได้", ai_limit:"วันนี้ใช้วิเคราะห์รูปครบ 30 ครั้งแล้ว ใช้การค้นหาเมนูหรือกรอกเองแทนได้", too_large:"รูปใหญ่เกินไป ลองถ่ายใหม่", auth:"หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบอีกครั้ง"}[r.error] || "วิเคราะห์รูปไม่สำเร็จ ลองถ่ายใหม่ให้เห็นอาหารชัดเจน");
      ph.items = (r.items||[]).map(x=>({name:String(x.name||"อาหาร"), portion:String(x.portion||""), kcal:Math.max(0,+x.kcal||0), carb:Math.max(0,+x.carb_g||0), na:Math.max(0,+x.sodium_mg||0)}));
      ph.note = r.note ? String(r.note) : ""; ph.state="done";
      const bx=$("#photoBox"); if(bx) bx.innerHTML=photoBoxHTML(); return;
    }
    const sample = window.claude?.use ? await window.claude.use("sample") : null;
    const lim = sample ? await sample.limits().catch(()=>null) : null;
    if(!sample || !lim?.images) throw new Error("ระบบวิเคราะห์รูปภาพยังไม่พร้อมในหน้านี้ ใช้การค้นหาเมนูหรือกรอกเองแทนได้");
    const prompt = `คุณเป็นนักโภชนาการไทย ดูรูปอาหารนี้ แล้วประเมินแต่ละรายการอาหารที่เห็น (รวมอาหารอีสาน เช่น ส้มตำ ลาบ ข้าวเหนียว ปลาร้า) ตอบเป็น JSON อย่างเดียว ตามรูปแบบนี้:
{"items":[{"name":"ชื่ออาหารภาษาไทย","portion":"ปริมาณโดยประมาณ เช่น 1 จาน","kcal":ตัวเลข,"carb_g":ตัวเลข,"sodium_mg":ตัวเลข}],"note":"คำแนะนำสั้นๆ 1-2 ประโยค สำหรับคนที่เสี่ยงความดันโลหิตสูง เน้นเรื่องความเค็ม"}
ถ้าในรูปไม่ใช่อาหาร ให้ items เป็น [] และบอกเหตุผลใน note`;
    const out = await sample.json(prompt, {images:[ph.blob], modelTier:"default"});
    ph.items = (out?.items||[]).map(x=>({name:String(x.name||"อาหาร"), portion:String(x.portion||""), kcal:Math.max(0,+x.kcal||0), carb:Math.max(0,+x.carb_g||0), na:Math.max(0,+x.sodium_mg||0)}));
    ph.note = out?.note ? String(out.note) : ""; ph.state="done";
  }catch(e){
    ph.state="error"; ph.error = e?.code==="not_granted" ? "ยังไม่ได้อนุญาตให้ใช้ระบบวิเคราะห์รูป กด “ลองอีกครั้ง” แล้วเลือกอนุญาต หรือใช้การค้นหาเมนูแทน" : e?.code==="rate_limited" ? "มีการใช้งานมากเกินไป รอสักครู่แล้วลองใหม่" : (e?.message||"วิเคราะห์รูปไม่สำเร็จ");
  }
  const b=$("#photoBox"); if(b) b.innerHTML=photoBoxHTML();
}

function notifItems(){
  if(!S.session) return [];
  const out=[], now=Date.now(), today=new Date(); today.setHours(0,0,0,0);
  if(S.session.role==="patient" || S.proxy){
    const p=P(); if(!p) return [];
    const r=p.risk;
    if(r && r.level!=="none") out.push({at:r.at, tone:RISK[r.level][1], title:`ผลประเมิน: ${RISK[r.level][0]}`, text:(r.reasons||[]).slice(0,3).join(" · "), go:["p-home",{}]});
    if(p.referral && p.referral.status!=="none") out.push({at:p.referral.at, tone:p.referral.status==="done"?"ok":"bad", title:REF[p.referral.status], text:p.referral.appt?`นัดวันที่ ${fmtDayKey(p.referral.appt)}${p.referral.place?" · "+p.referral.place:""}`:(p.referral.note||""), go:["p-home",{}]});
    patientAppts(p.id).filter(isUpcoming).forEach(a=>{ const at=apptAt(a); if(at-Date.now()<3*86400000) out.push({at:Math.max(a.createdAt||0, at-3*86400000), tone:"info", title:`นัดหมาย: ${a.type}`, text:`${fmtDayLong(a.date)} เวลา ${a.time} น. · ${a.place||RPH.short}`, go:["p-appts",{}]}); else if(a.createdAt) out.push({at:a.createdAt, tone:"info", title:`มีนัดหมายใหม่: ${a.type}`, text:`${fmtDayLong(a.date)} เวลา ${a.time} น.`, go:["p-appts",{}]}); });
    S.messages.filter(m=>m.pid===p.id).forEach(m=>{ const last=(m.replies||[]).slice(-1)[0]; if(last && last.role!=="patient") out.push({at:last.at, tone:"ok", title:"เจ้าหน้าที่ตอบกลับแล้ว", text:`${m.topic}: ${last.text}`, go:["p-contact",{}]}); });
    const bp=p.latest?.bp; if(!bp || now-bp.at>7*86400000) out.push({at:today.getTime(), tone:"warn", title:"ถึงเวลาวัดความดันโลหิต", text:bp?`วัดครั้งล่าสุด ${ago(bp.at)}`:"ยังไม่เคยบันทึกค่าความดัน", go:["a-bp",{}]});
    const t=foodTotals(S.food?.items||[]); if(t.na>2000) out.push({at:today.getTime()+1, tone:"bad", title:"โซเดียมวันนี้เกิน 2,000 มก.", text:`วันนี้ได้รับ ${nf(t.na)} มก. ควรลดเค็มมื้อต่อไป`, go:["p-food",{}]});
  } else {
    const pts=scopedPatients();
    pts.forEach(p=>{
      if(p.risk?.urgent) out.push({at:p.risk.at, tone:"bad", title:`ด่วน: ${fullName(p)}`, text:`ความดัน ${p.latest?.bp?.sys}/${p.latest?.bp?.dia} ต้องพบแพทย์ทันที`, go:["s-patient",{id:p.id}]});
      else if((p.risk?.level==="high"||p.risk?.level==="sick") && p.referral?.status==="pending") out.push({at:p.risk.at, tone:RISK[p.risk.level][1], title:`${RISK[p.risk.level][0]} รอส่งต่อ: ${fullName(p)}`, text:(p.risk.reasons||[]).slice(0,2).join(" · "), go:["s-patient",{id:p.id}]});
      if(p.createdAt && now-p.createdAt<7*86400000) out.push({at:p.createdAt, tone:"none", title:`ลงทะเบียนใหม่: ${fullName(p)}`, text:p.registeredBy?`โดย ${p.registeredBy}`:"ลงทะเบียนด้วยตนเอง", go:["s-patient",{id:p.id}]});
    });
    const ids=new Set(pts.map(p=>p.id)), t0=todayStart();
    S.appts.filter(a=>ids.has(a.pid)&&a.status==="scheduled"&&apptAt(a)>=t0&&apptAt(a)<t0+86400000).forEach(a=>{ const p=pts.find(x=>x.id===a.pid); out.push({at:t0+1, tone:"info", title:`นัดวันนี้ ${a.time} น.: ${fullName(p)}`, text:`${a.type} · ${a.place||RPH.short}`, go:["s-appts",{}]}); });
    pts.filter(needsFollow).forEach(p=>out.push({at:p.risk.at, tone:"sus", title:`ต้องติดตามนัดหมาย: ${fullName(p)}`, text:`${RISK[p.risk.level][0]} ยังไม่มีนัดหมาย`, go:["appt-form",{pid:p.id}]}));
    S.messages.filter(m=>m.status==="open" && (S.scope==="all"||ids.has(m.pid))).forEach(m=>out.push({at:m.lastAt||m.at, tone:m.kind==="help"?"warn":"none", title:`${m.kind==="help"?"ขอความช่วยเหลือ":"คำถามใหม่"}: ${m.pname}`, text:`${m.topic}${m.text?": "+m.text:""}`, go:["s-messages",{}]}));
  }
  return out.sort((a,b)=>b.at-a.at);
}

const FILTERS=[["all","ทั้งหมด"],["sick","กลุ่มป่วย"],["high","กลุ่มสงสัยป่วย"],["medium","กลุ่มเสี่ยง"],["low","กลุ่มปกติ"],["none","ยังไม่ประเมิน"],["follow","ต้องติดตาม"],["due","ครบกำหนดตรวจ"],["pending","รอส่งต่อ"],["urgent","ด่วน"],["disease","มีโรคประจำตัว"],["alcohol","ดื่มสุรา"],["smoke","สูบบุหรี่"],["drug","สารเสพติด"],["nohome","ยังไม่มีพิกัดบ้าน"]];
function applyFilter(pts,f){
  const L=p=>p.latest||{};
  switch(f){
    case "sick": case "high": case "medium": case "low": return pts.filter(p=>p.risk?.level===f);
    case "follow": return pts.filter(needsFollow);
    case "due": return pts.filter(visitDue);
    case "none": return pts.filter(p=>!p.risk || p.risk.level==="none");
    case "pending": return pts.filter(p=>p.referral?.status==="pending");
    case "urgent": return pts.filter(p=>p.risk?.urgent);
    case "disease": return pts.filter(p=>(p.diseases||[]).some(d=>d!=="ไม่มี")||p.diseaseOther);
    case "alcohol": return pts.filter(p=>L(p).alcohol?.risky);
    case "smoke": return pts.filter(p=>L(p).alcohol?.smoke==="yes");
    case "drug": return pts.filter(p=>L(p).alcohol?.drug==="yes");
    case "nohome": return pts.filter(p=>!p.lat);
    case "f-bmi": return pts.filter(p=>L(p).body?.bmi>=25);
    case "f-waist": return pts.filter(p=>L(p).waist?.over);
    case "f-family": return pts.filter(p=>L(p).family?.positive);
    case "f-salt": return pts.filter(p=>L(p).salt?.score>=20);
  }
  return pts;
}

  if(qf) pts=pts.filter(p=>norm(p.first).includes(qf));
  if(ql) pts=pts.filter(p=>norm(p.last).includes(ql));
  if(qc) pts=pts.filter(p=>(p.cid||"").includes(qc));
  const order={sick:0,high:1,medium:2,low:3,none:4};
  pts.sort((a,b)=>(b.risk?.urgent?1:0)-(a.risk?.urgent?1:0) || (order[a.risk?.level||"none"]-order[b.risk?.level||"none"]) || (b.updatedAt||0)-(a.updatedAt||0));
  if(!scopedPatients().length){ box.innerHTML=`<div class="card flat"><b>ยังไม่มีผู้รับบริการในระบบ</b><p class="muted">เมื่อผู้รับบริการลงทะเบียนเอง หรือ อสม. ลงทะเบียนแทน รายชื่อจะแสดงที่นี่ทันที</p></div>`; return; }
  box.innerHTML = `<p class="small muted">พบ ${pts.length} ราย</p>` + pts.slice(0,200).map(p=>{ const t=RISK[p.risk?.level||"none"][1]; const bp=p.latest?.bp; return `<button class="pcard" data-go="s-patient" data-p='{"id":"${p.id}"}'><div class="avatar ${t}">${esc((p.first||"?")[0])}</div><div class="grow"><b>${esc(fullName(p))}</b>${p.demo?' <span class="badge b-none">ตัวอย่าง</span>':""}<div class="small muted">อายุ ${ageOf(p.dob)?.y??"-"} ปี · ${maskCID(p.cid)}${bp?` · BP ${bp.sys}/${bp.dia}`:""}</div>${p.referral?.status&&p.referral.status!=="none"?`<div class="small" style="color:var(--${p.referral.status==="done"?"ok":"bad"})">${REF[p.referral.status]}</div>`:""}</div>${riskBadge(p.risk?.level)}</button>`; }).join("");
}

/* =================== REAL-TIME CLOCK =================== */
const TH_DAY=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
function clockText(){ const d=new Date(); return `วัน${TH_DAY[d.getDay()]}ที่ ${d.getDate()} ${TH_MON[d.getMonth()]} ${d.getFullYear()+543} · ${z2(d.getHours())}:${z2(d.getMinutes())}:${z2(d.getSeconds())} น.`; }
const clockHTML = (cls="") => `<div class="clock ${cls}" data-clock><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="num">${clockText()}</span></div>`;
setInterval(()=>{ const t=clockText(); $$("[data-clock] span").forEach(e=>{ e.textContent=t; }); },1000);
const timeNow = () => { const d=new Date(); return `${z2(d.getHours())}:${z2(d.getMinutes())}`; };
const addDays = (n, from=new Date()) => { const d=new Date(from); d.setDate(d.getDate()+n); return dayKey(d); };
const fmtDayLong = k => { if(!k) return "-"; const [y,m,d]=k.split("-").map(Number); const dt=new Date(y,m-1,d); return `วัน${TH_DAY[dt.getDay()]}ที่ ${d} ${TH_MON[m-1]} ${y+543}`; };

/* =================== APPOINTMENTS & FOLLOW-UP =================== */
const APPT_TYPES=["ติดตามประเมินซ้ำ","ตรวจสุขภาพประจำเดือน","พบแพทย์","เยี่ยมบ้าน","รับยา"];
const APPT_ST={ scheduled:["นัดแล้ว","info"], done:["มาตามนัด","ok"], missed:["ไม่มาตามนัด","bad"], cancelled:["ยกเลิกแล้ว","none"] };
const apptAt = a => new Date(`${a.date}T${a.time||"09:00"}:00`).getTime();
const todayStart = () => { const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const isUpcoming = a => a.status==="scheduled" && apptAt(a) >= todayStart();
function patientAppts(pid){ return S.appts.filter(a=>a.pid===pid).sort((x,y)=>apptAt(x)-apptAt(y)); }
function nextAppt(pid){ return patientAppts(pid).find(isUpcoming); }
function needsFollow(p){ const lv=p.risk?.level; return (lv==="high"||lv==="sick") && !nextAppt(p.id); }
function visitDue(p){ return !p.lastVisit || Date.now()-p.lastVisit.at > 30*86400000; }

function apptCard(a, staffView){
  const st=APPT_ST[a.status]||APPT_ST.scheduled, [y,m,d]=a.date.split("-").map(Number);
  const p=allPatients().find(x=>x.id===a.pid);
  const overdue = a.status==="scheduled" && apptAt(a) < todayStart();
  return `<article class="appt ${a.status}">
    <div class="appt-date"><b class="num">${d}</b><span>${TH_MON_S[m-1]}</span><small class="num">${y+543}</small></div>
    <div class="grow stack" style="gap:6px">
      <div class="spread"><b>${esc(a.type)}</b>${overdue?'<span class="badge b-bad">เลยวันนัด</span>':`<span class="badge b-${st[1]}">${st[0]}</span>`}</div>
      <div class="small">${fmtDayLong(a.date)} · <b class="num">${esc(a.time||"09:00")} น.</b></div>
      <div class="small muted">${esc(a.place||RPH.short)}${a.note?` · ${esc(a.note)}`:""}</div>
      ${staffView&&p?`<button class="back" data-go="s-patient" data-p='{"id":"${p.id}"}'>${esc(fullName(p))} ${riskBadge(p.risk?.level)}</button>`:""}
      ${staffView && a.status==="scheduled" ? `<div class="row"><button class="btn sm" data-act="apptStatus" data-id="${a.id}" data-v="done">มาตามนัด</button><button class="btn sm ghost" data-act="apptStatus" data-id="${a.id}" data-v="missed">ไม่มาตามนัด</button><button class="btn sm ghost" data-go="appt-form" data-p='{"id":"${a.id}"}'>เลื่อน/แก้ไข</button><button class="btn sm ghost" data-act="apptStatus" data-id="${a.id}" data-v="cancelled">ยกเลิก</button></div>`:""}
      ${staffView && a.status==="done" && !p?.demo ? `<button class="btn sm soft" data-go="s-visit" data-p='{"id":"${a.pid}"}'>บันทึกผลตรวจ</button>`:""}
      ${a.status!=="scheduled"&&a.statusBy?`<small class="muted">${esc(a.statusBy)} · ${fmtDT(a.statusAt)}</small>`:""}
    </div></article>`;
}
function scrSAppts(){
  const tab=S.apptTab||"follow";
  const pts=scopedPatients(), ids=new Set(pts.map(p=>p.id));
  const appts=S.appts.filter(a=>ids.has(a.pid));
  const t0=todayStart(), t1=t0+86400000;
  const follow=pts.filter(needsFollow), due=pts.filter(p=>visitDue(p) && !nextAppt(p.id) && !needsFollow(p));
  const today=appts.filter(a=>a.status==="scheduled" && apptAt(a)>=t0 && apptAt(a)<t1).sort((a,b)=>apptAt(a)-apptAt(b));
  const up=appts.filter(a=>a.status==="scheduled" && apptAt(a)>=t1).sort((a,b)=>apptAt(a)-apptAt(b));
  const past=appts.filter(a=>a.status!=="scheduled" || apptAt(a)<t0).sort((a,b)=>apptAt(b)-apptAt(a));
  const tabs=[["follow","ต้องติดตาม",follow.length],["today","วันนี้",today.length],["up","นัดที่จะถึง",up.length],["past","ที่ผ่านมา",past.length]];

function sparkline(points, label, unit, lim){
  if(points.length<2) return "";
  const W=300,H=90,pl=8,pr=8,pt=14,pb=18, vs=points.map(p=>p.v), lo=Math.min(...vs,lim??Infinity)*0.95, hi=Math.max(...vs,lim??-Infinity)*1.05;
  const x=i=>pl+i*(W-pl-pr)/(points.length-1), y=v=>pt+(hi-v)*(H-pt-pb)/((hi-lo)||1);
  const d=points.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
  const last=points[points.length-1];
  return `<div class="spark"><div class="spread small"><b>${label}</b><span class="num">ล่าสุด ${last.v} ${unit}</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="แนวโน้ม${label}">${lim!=null?`<line x1="${pl}" x2="${W-pr}" y1="${y(lim)}" y2="${y(lim)}" stroke="var(--bad)" stroke-dasharray="4 4"/>`:""}<path d="${d} L${x(points.length-1)} ${H-pb} L${x(0)} ${H-pb}Z" fill="var(--brand-soft)" opacity=".7"/><path d="${d}" fill="none" stroke="var(--brand)" stroke-width="2.5"/>${points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===points.length-1?4.5:3}" fill="var(--brand)"/>`).join("")}<text x="${pl}" y="${H-4}" font-size="10" fill="var(--ink-2)">${fmtDate(points[0].at)}</text><text x="${W-pr}" y="${H-4}" font-size="10" text-anchor="end" fill="var(--ink-2)">${fmtDate(last.at)}</text></svg></div>`;
}
function visitsHTML(p){
  const vs=S.visits, asc=[...vs].reverse();
  const bps=asc.filter(v=>v.bp).map(v=>({at:v.at,data:{sys:v.bp.sys,dia:v.bp.dia}}));
  const ws=asc.filter(v=>v.w).map(v=>({at:v.at,v:v.w})), fs=asc.filter(v=>v.fbs).map(v=>({at:v.at,v:v.fbs}));
  const na=nextAppt(p.id);
  return `<section class="card flat"><div class="sumgrid"><div><span class="small muted">มาตรวจทั้งหมด</span><span class="v num">${vs.length}</span><span class="small muted">ครั้ง</span></div><div><span class="small muted">ครั้งล่าสุด</span><span class="v" style="font-size:1rem">${vs[0]?fmtDate(vs[0].at):"-"}</span><span class="small muted">${vs[0]?esc(vs[0].time)+" น.":""}</span></div><div><span class="small muted">นัดถัดไป</span><span class="v" style="font-size:1rem">${na?fmtDayKey(na.date):"-"}</span><span class="small muted">${na?esc(na.time)+" น.":""}</span></div></div></section>
  ${bps.length>=2?bpChart(bps.slice(-12)):""}
  ${(ws.length>=2||fs.length>=2)?`<section class="card"><div class="grid2">${sparkline(ws.slice(-12),"น้ำหนัก","กก.")}${sparkline(fs.slice(-12),"น้ำตาลในเลือด","มก./ดล.",126)}</div></section>`:""}
  ${vs.length?vs.map(visitCard).join(""):`<div class="card flat"><p class="muted">ยังไม่มีบันทึกการตรวจ เมื่อมาตรวจสุขภาพประจำเดือน ผลตรวจทุกครั้งจะแสดงที่นี่ เรียงจากล่าสุด</p></div>`}`;
}
function scrVisits(params){
  const p = isPatientMode() ? P() : allPatients().find(x=>x.id===params.id);
  if(!p) return `${backBtn()}<p>ไม่พบข้อมูล</p>`;
  return `${backBtn()}<div class="spread"><h2>ประวัติการตรวจสุขภาพ</h2>${isStaff()&&!isPatientMode()&&!p.demo?`<button class="btn sm" data-go="s-visit" data-p='{"id":"${p.id}"}'>+ บันทึกผลตรวจ</button>`:""}</div>
  <p class="muted">${esc(fullName(p))} · ข้อมูลการตรวจ การให้คำปรึกษา และนัดหมาย ย้อนหลังทั้งหมดในหน้าเดียว</p>${visitsHTML(p)}`;
}

function onMotion(e){

  const d = mag - stepState.avg, now=performance.now();

}
async function startStepCounter(){

    p.risk=computeRisk(p); p.risk.at=Date.now()-i*3600000*5; if(p.risk.level==="high"||p.risk.level==="sick") p.referral={status:i===1?"pending":"sent",at:Date.now()-i*3600000, appt:i===1?"":dayKey(new Date(Date.now()+86400000*5)), place:"รพ.โซ่พิสัย", by:"ระบบ"};
    return p;
  });
  return _demo;
}

document.addEventListener("click", async e=>{
  const g=e.target.closest("[data-go]");
  if(g && !g.disabled){ e.preventDefault(); let p={}; try{ p=JSON.parse(g.dataset.p||"{}"); }catch(x){} if(g.dataset.reset) S.back=[]; if(g.dataset.go==="s-patients"||g.dataset.go==="s-map"){ if(g.dataset.reset) S.filter="all"; } go(g.dataset.go,p,!!g.dataset.reset); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const fn=ACT[a.dataset.act]; if(fn){ if(a.tagName!=="INPUT") e.preventDefault(); fn(a,e); }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.matches('[data-act="demo"]')){ S.demo=t.checked; render(true); return; }
  if(t.id==="dob-d"||t.id==="dob-m"||t.id==="dob-y"){ const d=$("#dob-d").value,m=$("#dob-m").value,y=$("#dob-y").value; const o=$("#ageOut"); if(d&&m&&y){ const iso=`${y-543}-${z2(m)}-${z2(d)}`; o.innerHTML=`อายุ <b>${ageText(iso)}</b>`; } }
  if(t.id==="foodPhoto" && t.files?.[0]){ (async()=>{ const blob=await downscale(t.files[0]).catch(()=>t.files[0]); if(S.photo?.url) URL.revokeObjectURL(S.photo.url); S.photo={blob, url:URL.createObjectURL(blob), state:"ready"}; $("#photoBox").innerHTML=photoBoxHTML(); })(); }
  if(t.id==="msgFiles" && t.files?.length){ addAttach([...t.files]); t.value=""; return; }
  if(t.name==="none" && t.checked){ $$('input[name="members"]').forEach(x=>x.checked=false); }
  if(t.name==="members" && t.checked){ $$('input[name="none"]').forEach(x=>x.checked=false); }
  if(t.name==="diseases" && t.value==="ไม่มี" && t.checked){ $$('input[name="diseases"]').forEach(x=>{ if(x.value!=="ไม่มี") x.checked=false; }); }
  else if(t.name==="diseases" && t.checked){ $$('input[name="diseases"][value="ไม่มี"]').forEach(x=>x.checked=false); }
});
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.live==="search"){ renderPResults(); return; }
  if(t.id==="foodQ"){ renderFoodResults(); return; }
  if(t.id==="bp1s"||t.id==="bp1d") bpHint();
  if(t.id==="stepGoalIn"){ return; }
  if(/^sm-v\d$/.test(t.id)){ smLive(+t.id.slice(4)); }
  if(t.id==="v-salt"){ const o=$("#v-saltOut"); if(o){ const c=t.value===""?null:saltmClass(+t.value); o.innerHTML=c?`<div class="saltm-row t-${c.tone}"><span class="face t-${c.tone}">${faceSVG(c.face)}</span><div class="grow"><b>${c.label}</b><div class="small">${c.portion}</div></div></div>`:""; } }
  if(t.id==="hrAge"){ const o=$("#hrOut"); if(o) o.innerHTML=hrText(t.value); return; }
  if(t.id==="v-w"||t.id==="v-h") visitBmi();
  if(t.id==="bw"||t.id==="bh") bmiLive();
  if(t.id==="rp-cid"||t.id==="lg-cid"||t.id==="ls-cid"||t.id==="rs-cid"||t.id==="me-cid"){ const d=digits(t.value).slice(0,13); let s=d[0]||""; if(d.length>1) s+="-"+d.slice(1,5); if(d.length>5) s+="-"+d.slice(5,10); if(d.length>10) s+="-"+d.slice(10,12); if(d.length>12) s+="-"+d[12]; t.value=s; }
  if(t.closest("form")) S.dirty=true;
});
document.addEventListener("submit", async e=>{
  const f=e.target.closest("form[data-form]"); if(!f) return;
  e.preventDefault();
  const fn=FORMS[f.dataset.form]; if(!fn) return;
  const btn=f.querySelector("button:not([type=button])"); if(btn) btn.disabled=true;
  try{ await fn(f, new FormData(f)); }
  catch(err){ console.error(err); const m=f.querySelector("#formMsg,#regMsg")||$("#formMsg"); if(m) m.innerHTML=`<div class="msg err">${esc(err.message||"บันทึกไม่สำเร็จ ลองอีกครั้ง")}</div>`; }
  finally{ if(btn && document.contains(btn)) btn.disabled=false; }
});
